<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13">
  <!-- Hand-built example session: correct commands, representative
       output. Replaced by the CI tag-run recording at release time
       (docs/demo/README.md). -->
  <rect width="800" height="392" rx="10" fill="#0e2a1c"/>
  <rect width="800" height="34" rx="10" fill="#081b11"/>
  <rect y="24" width="800" height="10" fill="#081b11"/>
  <circle cx="22" cy="17" r="6" fill="#f5c542"/>
  <circle cx="42" cy="17" r="6" fill="#2e9e63"/>
  <circle cx="62" cy="17" r="6" fill="#3ddc84"/>
  <text x="400" y="22" text-anchor="middle" fill="#a8e063">SibillaOS - from install to first token</text>
  <g xml:space="preserve">
    <text x="20" y="62"  fill="#3ddc84">$ <tspan fill="#e8f5ee">sibilla status</tspan></text>
    <text x="20" y="84"  fill="#9fc7b2">engine:  ollama (active)</text>
    <text x="20" y="106" fill="#9fc7b2">model:   <tspan fill="#f5c542">hf.co/bartowski/Qwen_Qwen3-4B-GGUF</tspan></text>
    <text x="20" y="128" fill="#9fc7b2">gateway: http://192.168.1.50:8080 up (key in /etc/llmd/apikey)</text>
    <text x="20" y="162" fill="#3ddc84">$ <tspan fill="#e8f5ee">KEY=$(sudo cat /etc/llmd/apikey)  MODEL=$(sudo cat /etc/llmd/model)</tspan></text>
    <text x="20" y="188" fill="#3ddc84">$ <tspan fill="#e8f5ee">curl localhost:8080/v1/chat/completions \</tspan></text>
    <text x="20" y="210" fill="#e8f5ee">     -H "Authorization: Bearer $KEY" \</text>
    <text x="20" y="232" fill="#e8f5ee">     -d '{"model":"'"$MODEL"'","messages":</text>
    <text x="20" y="254" fill="#e8f5ee">          [{"role":"user","content":"hello"}]}'</text>
    <text x="20" y="290" fill="#9fc7b2">{"choices":[{"message":{"role":"assistant",</text>
    <text x="20" y="312" fill="#9fc7b2">  "content":<tspan fill="#a8e063">"Hello! How can I help you today?"</tspan>}}]}</text>
    <text x="20" y="352" fill="#3ddc84">$ <tspan fill="#e8f5ee">_</tspan></text>
  </g>
</svg>
